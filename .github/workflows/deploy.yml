name: Deploy to ECS

on:
push:
branches:
- develop

jobs:
deploy:
name: Build and Deploy
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build PHP image
    run: |
      docker build -t inventory-php:latest -f docker/php/Dockerfile .
      docker tag inventory-php:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inventory-php:latest

  - name: Push PHP image
    run: |
      docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inventory-php:latest

  - name: Build NGINX image
    run: |
      docker build -t inventory-nginx:latest -f docker/nginx/Dockerfile .
      docker tag inventory-nginx:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inventory-nginx:latest

  - name: Push NGINX image
    run: |
      docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/inventory-nginx:latest

  - name: Force ECS deployment
    run: |
      aws ecs update-service \
        --cluster syslac-cluster \
        --service syslac-service \
        --force-new-deployment
```

