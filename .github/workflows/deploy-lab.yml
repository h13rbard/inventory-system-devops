name: Deploy to ECS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - run: aws sts get-caller-identity

      - run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 159858924500.dkr.ecr.us-east-2.amazonaws.com

      - run: |
          docker build -t 159858924500.dkr.ecr.us-east-2.amazonaws.com/inventory-php:${IMAGE_TAG} -f docker/php/Dockerfile .

      - run: |
          docker push 159858924500.dkr.ecr.us-east-2.amazonaws.com/inventory-php:${IMAGE_TAG}

      - run: |
          docker build -t 159858924500.dkr.ecr.us-east-2.amazonaws.com/inventory-nginx:${IMAGE_TAG} -f docker/nginx/Dockerfile .

      - run: |
          docker push 159858924500.dkr.ecr.us-east-2.amazonaws.com/inventory-nginx:${IMAGE_TAG}

