version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env

    container_name: inventory_app

    working_dir: /var/www

    volumes:
      - ./:/var/www
      - ./images:/var/www/images

    networks:
      - inventory_network

  nginx:
    image: nginx:stable-alpine

    container_name: inventory_nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - inventory_network

  mysql:
    image: mysql:8.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    container_name: inventory_mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: inventario
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: inventory_user

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - inventory_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    container_name: inventory_phpmyadmin

    ports:
      - "8081:80"

    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root

    depends_on:
      - mysql

    networks:
      - inventory_network

volumes:
  mysql_data:

networks:
  inventory_network:


