services:

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile



    ports:
      - "8080:80"

    volumes:
      - ../:/var/www

    depends_on:
      - app

  app:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile


    volumes:
      - ../:/var/www

    environment:
      DB_HOST: mysql
      DB_DATABASE: inventario
      DB_USERNAME: root
      DB_PASSWORD: root

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0


    ports:
      - "3307:3306"

    environment:
      MYSQL_DATABASE: inventario
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
